<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Simulador</title>
  </head>
  <body>
    <div class="container-form">
      <h1>Simulador</h1>
      <form action="" class="formulario">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu Nome" class="nome" required />

        <label for="mensalidade">Mensalidade:</label>
        <input type="number" name="mensalidade" id="mensalidade" placeholder="Digite sua Mensalidade" class="mensalidade" required />

        <label for="tempo">Tempo:</label>
        <select name="tempo" id="tempo" class="tempo">
          <option value="" disabled selected>Selecione o tempo</option>
          <option value="1">1 ano</option>
          <option value="2">2 anos</option>
          <option value="3">3 anos</option>
        </select>

        <div class="container-button">
          <button type="button" onclick="calcularJuros()">Simular</button>
        </div>
      </form>
    </div>
    <script src="js/main.js"></script>
